    <!-- 提前對後端做 DNS/TCP/TLS 握手。實測冷連線 TTFB 1160ms、暖連線 390ms，
         握手本身就吃掉約 780ms，比整趟跨洲往返還貴。SSO 導向前先暖好，
         Google 回跳時就少付這筆。crossorigin 是必要的：auth 一律帶 credentials，
         沒有它會另開一條 anonymous 連線，等於白暖。 -->
    <link rel="preconnect" href="https://gts-core.jaao.tw" crossorigin />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
