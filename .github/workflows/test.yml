name: Test

# ⚠️ 刻意不設 paths-ignore：被它跳過的 job 狀態是「從未回報」而不是「通過」，
# 當 required check 時純文件 PR 會卡住合不掉。
on:
  pull_request:
  workflow_call:   # deploy.yml 的部署前關卡 uses 這支，不複製步驟（見 deploy.yml）

# ⚠️ 與 deploy.yml 的 cancel-in-progress: false 是刻意的差別，別改成一致：
# 測試沒有副作用，取消是安全的；部署會切流量，不能取消。
#
# ⚠️ `|| github.sha`：被 workflow_call 呼叫時是 push 事件、head_ref 為空，
# 沒有兜底會讓所有 main 部署共用一組而互相取消。
# 同理，若再多一支 workflow 也 uses 這支，兩者會落進同一組互殺（已實測）。
concurrency:
  group: test-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # action 一律用 commit SHA 釘版（後方註解標對應 tag），與 deploy.yml 的慣例一致
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # 與 Dockerfile 的 node:24-alpine、package.json 的 engines.node 對齊，三處要一起改
          # （deploy.yml 不算——它 uses 這支，不會有第四份）
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # lint 排在 test 前面：機械性錯誤（未使用的變數、拼錯的識別字）先擋掉，
      # 免得測試紅了還要先分辨到底是邏輯壞了還是打錯字
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
