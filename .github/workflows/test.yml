name: Test

# 刻意不設 paths-ignore：這個 workflow 要當 branch protection 的 required check，
# 而被 paths-ignore 跳過的 job 是「從未回報」而不是「通過」，純文件 PR 會卡住合不掉。
# 測試只跑 ~250ms，全跑的成本遠低於例外規則的維護成本。
on:
  pull_request:
  # deploy.yml 的部署前關卡直接 `uses:` 這支，而不是自己複製一份同樣的步驟。
  # 兩份的話 node 版本與 action SHA 就有四處要一起改（Dockerfile、package.json、
  # 兩個 workflow），而且沒有東西會發現它們漂移——PR 與 main 就會被不同的
  # 檢查把關，有人往這裡加一個步驟，main 的部署卻不會跑到。
  workflow_call:

# 同一支 PR 只留最新那次測試。這裡取消是安全的（測試沒有副作用，不像部署會切流量），
# 舊 commit 的結果本來就沒有參考價值——required check 看的是最新 commit 的 run。
# ⚠️ 與 deploy.yml 的 cancel-in-progress: false 是刻意的差別，別順手改成一致。
#
# `|| github.sha` 是給 workflow_call 用的：從 deploy.yml 呼叫時是 push 事件，
# head_ref 為空，group 會退化成所有 main 部署共用一個而互相取消。用 sha 兜底
# 讓每個 commit 各自成組。
#
# ⚠️ 實測到的行為：這個 group 是跟著「被呼叫的這支 workflow」算的，所以若同一個
# 事件裡有兩個地方都跑到 test.yml（例如再多一支 workflow 也 `uses:` 它），
# 兩者會落進同一組而互相 cancel。目前不會發生——PR 只有 test.yml 自己跑、
# push to main 只有 deploy.yml 呼叫它。要再加呼叫端的話記得先處理這件事。
concurrency:
  group: test-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # action 一律用 commit SHA 釘版（後方註解標對應 tag），與 deploy.yml 的慣例一致
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # 與 Dockerfile 的 node:24-alpine、package.json 的 engines.node 對齊，三處要一起改
          # （deploy.yml 不算——它 uses 這支，不會有第四份）
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # lint 排在 test 前面：機械性錯誤（未使用的變數、拼錯的識別字）先擋掉，
      # 免得測試紅了還要先分辨到底是邏輯壞了還是打錯字
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
