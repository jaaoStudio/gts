name: Build & Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - 'docs/**'
      - 'deploy/**'          # VM 端腳本改動不需要重 build（需手動同步到 VM）

# 同一時間只允許一個部署在跑。
#
# ⚠️ 這不是效能考量，是正確性：兩個部署重疊時，**先切換的不一定是先觸發的**。
# 連續合併兩支 PR（2026-09-09 就發生過，兩次 push 相隔 13 秒）會同時起兩個 run，
# 各自建自己那個 commit 的 image。若較舊那個建得比較慢、藍綠切換排在後面，
# 線上就會退回舊 code——而 Actions 上**兩個 run 都是綠燈**，沒有任何錯誤訊息。
#
# cancel-in-progress 刻意設為 false（排隊，不取消）：取消可能打斷正在進行的
# 藍綠切換，留下半套狀態。排隊的話舊的先跑完、新的後蓋上，最新的 commit 一定
# 最後生效，代價只是線上會短暫停在舊版本幾分鐘。
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  # Harbor 沿用 boss-timing 那組（HARBOR_URL/USER/PASSWORD secrets）
  IMAGE: ${{ secrets.HARBOR_URL }}/gts/gts_web_store

jobs:
  # 部署前的關卡。PR 上的測試由 test.yml 負責，這裡擋的是「直接 push 到 main」
  # 以及 merge 之後才浮現的問題——沒有這一關，紅燈的 main 仍會被推上正式站。
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # 與 Dockerfile 的 node:24-alpine、package.json 的 engines.node 對齊，三處要一起改
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # 以下 action 一律用 commit SHA 釘版（後方註解標對應 tag），
      # 避免 tag 被移動導致 CI 執行到未預期的程式碼。升版時兩者要一起改。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to Harbor
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ secrets.HARBOR_URL }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          # ⚠️ 新 VM 若是 ARM 改成 linux/arm64（VM 上跑 `uname -m`：aarch64→arm64、x86_64→amd64）
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VITE_DIRECTUS_URL=/api
            VITE_DIRECTUS_PUBLIC_URL=${{ secrets.VITE_DIRECTUS_PUBLIC_URL }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE }}:cache,mode=max

      - name: Deploy (blue-green switch)
        # 自己 ssh，不依賴第三方 action（私鑰只在本步驟指令內使用）
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          GIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p ~/.ssh && echo "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "$VM_USER@$VM_HOST" "~/gts-web/deploy.sh $GIT_SHA"
