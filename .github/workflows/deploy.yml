name: Build & Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - 'docs/**'
      - 'deploy/**'          # VM 端腳本改動不需要重 build（需手動同步到 VM）

# 同一時間只允許一個部署在跑。
#
# ⚠️ 這不是效能考量，是正確性：兩個部署重疊時，**先切換的不一定是先觸發的**。
# 連續合併兩支 PR（2026-09-09 就發生過，兩次 push 相隔 13 秒）會同時起兩個 run，
# 各自建自己那個 commit 的 image。若較舊那個建得比較慢、藍綠切換排在後面，
# 線上就會退回舊 code——而 Actions 上**兩個 run 都是綠燈**，沒有任何錯誤訊息。
#
# cancel-in-progress 刻意設為 false（排隊，不取消）：取消可能打斷正在進行的
# 藍綠切換，留下半套狀態。
#
# ⚠️ 但這裡只有互斥，**沒有版本順序保證**。GitHub 的佇列是 FIFO 依「進入等待
# 的時間」，不是 commit 順序；手動重跑一個舊 commit 的 workflow 也照樣會排進來。
# 「最新的 commit 一定最後生效」要靠下面的 freshness job，不是靠這個區塊。
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  # Harbor 沿用 boss-timing 那組（HARBOR_URL/USER/PASSWORD secrets）
  IMAGE: ${{ secrets.HARBOR_URL }}/gts/gts_web_store

jobs:
  # 部署前的關卡。PR 上的測試由 test.yml 負責，這裡擋的是「直接 push 到 main」
  # 以及 merge 之後才浮現的問題——沒有這一關，紅燈的 main 仍會被推上正式站。
  #
  # 直接 uses 同一支 workflow，不複製步驟：PR 與部署必須跑「同一套」檢查，
  # 而複製出來的兩份沒有東西會發現它們漂移。
  test:
    uses: ./.github/workflows/test.yml

  # 過期檢查。concurrency 只保證不同時跑，不保證誰先誰後：
  #
  #   • 排隊期間 main 可能已經往前走，於是排在後面執行的反而是舊 commit
  #   • 手動重跑一個舊 commit 的 workflow，也會把正式站蓋回那一版
  #
  # 兩種情況都會讓線上退回舊 code，而 Actions 上**全是綠燈**、沒有任何錯誤訊息。
  # 這一關把「本 run 的 commit 已經不是 main 的 HEAD」判定為 no-op：
  # build-and-deploy 整個 job 被 skip（顯示為 skipped，不是 failed），
  # 因為那不是壞掉，是這次部署已經沒有意義了。
  # 刻意不設 `needs: test`：這個檢查只做 git fetch + git diff，不吃 test 的任何產物。
  # 掛上去等於白等（實測 test 15s + 一次 job 派工約 4s 都加進部署的關鍵路徑）。
  # 由 build-and-deploy 的 `needs: [test, freshness]` 同時擋這兩件，兩者並行即可。
  freshness:
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.check.outputs.stale }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 需要完整歷史：腳本要 diff 本次 SHA 與 main HEAD 之間的變更檔案，
          # 預設的 depth=1 只有一個 commit，diff 不出東西
          fetch-depth: 0

      - name: 確認這個 commit 仍值得部署
        id: check
        run: |
          set +e
          .github/scripts/deploy-freshness.sh "$GITHUB_SHA"
          CODE=$?
          set -e
          if [ "$CODE" -eq 0 ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          elif [ "$CODE" -eq 10 ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=跳過部署::本次 commit 已過期，較新的 run 會接手。這不是失敗。"
          else
            # 腳本自己壞了。這種情況不能當成「已過期」默默跳過，也不能當成
            # 「還很新」照樣部署——兩種猜測都可能蓋錯版本，直接讓它紅。
            echo "::error title=過期檢查失敗::deploy-freshness.sh 離開碼 ${CODE}，無法判斷是否該部署。"
            exit 1
          fi

  build-and-deploy:
    # 兩者都要列——freshness 已不再 needs: test，所以 test 不會被隱含帶進來
    needs: [test, freshness]
    if: needs.freshness.outputs.stale == 'false'
    runs-on: ubuntu-latest
    steps:
      # 以下 action 一律用 commit SHA 釘版（後方註解標對應 tag），
      # 避免 tag 被移動導致 CI 執行到未預期的程式碼。升版時兩者要一起改。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # 下面那道最後檢查同樣要 diff 兩個 commit

      # ⚠️ 這裡原本有一步 `Set up QEMU`。amd64-only 的 build 跑在 x86_64 runner 上
      # 不需要 binfmt 模擬，那一步只是去拉 tonistiigi/binfmt image（實測 4～15 秒，
      # 佔部署總時間最多兩成）。若哪天把下面的 platforms 改成 linux/arm64，
      # 要把它加回來。
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to Harbor
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ secrets.HARBOR_URL }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          # ⚠️ 新 VM 若是 ARM 改成 linux/arm64（VM 上跑 `uname -m`：aarch64→arm64、x86_64→amd64）
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VITE_DIRECTUS_URL=/api
            VITE_DIRECTUS_PUBLIC_URL=${{ secrets.VITE_DIRECTUS_PUBLIC_URL }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE }}:cache,mode=max

      # 最後一道，就貼在切流量之前。
      #
      # freshness job 的結果會被快取：若本 run 的 freshness 曾經通過、而
      # build-and-deploy 失敗，之後點「Re-run failed jobs」只會重跑失敗的 job
      # 與其下游——freshness 是成功的，不會重跑，於是沿用舊的 stale=false。
      # 期間若已有較新的版本上線，這一路就會把正式站蓋回舊版。
      #
      # 這裡刻意用「紅燈」而不是 freshness job 那種 no-op skip：走到這裡代表
      # 有人手動重跑了一個過期的部署，該讓他知道被拒絕，而不是給一個
      # 什麼都沒做卻全綠的 run。
      # 這裡不必區分離開碼 10（過期）與其他（腳本壞了）——兩種都不該部署。
      # 預設 shell 是 `bash -e`，腳本非 0 本身就會讓步驟紅，只需補上說明。
      - name: 切流量前再確認一次（擋 re-run 繞過 freshness）
        run: |
          .github/scripts/deploy-freshness.sh "$GITHUB_SHA" || {
            echo "::error title=拒絕部署過期版本::這個 commit 已不是要上線的版本（離開碼 $?）。若確實要部署它，請對最新 commit 重跑整個 workflow，或直接推一個新 commit。"
            exit 1
          }

      # 自己 ssh，不依賴第三方 action。私鑰的 secret 只注入這一步；
      # 寫出來的檔案在同一個 job 的後續步驟可用（runner 用完即銷毀）。
      - name: 設定部署用 SSH key
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && echo "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key

      # `deploy/**` 在 paths-ignore 內，腳本改動不會經 CI 更新到 VM，必須手動 scp。
      # 2026-09-11 真的漏過一次：#25 改了三支腳本、PR 裡也寫了「merge 後要同步」，
      # 然後 merge 後就忘了——而且**完全沒有症狀**，因為 VM 上那組是自我一致的舊版，
      # 部署照樣全綠、藍綠也照樣交替。是後來手動跑 active_tag 才撞出來的。
      #
      # 所以這一關不靠人記得。不一致就紅，而且是在切流量**之前**紅：
      # 正式站不受影響，只是這次沒部署成功。
      #
      # 註：VM 上少了某支檔案時，`md5sum … | sort` 的 pipeline 離開碼仍是 0
      # （sort 成功），所以不會走下面的 ssh 失敗分支；但 md5sum 的錯誤訊息被
      # `2>&1` 收進 REMOTE，比對照樣不等、照樣紅。兩條路都抓得到（已實測）。
      - name: 確認 VM 上的腳本與 repo 一致
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          LOCAL=$(cd deploy && md5sum deploy.sh rollback.sh lib-slot.sh | sort)
          REMOTE=$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "$VM_USER@$VM_HOST" 'cd ~/gts-web && md5sum deploy.sh rollback.sh lib-slot.sh 2>&1 | sort') || {
              echo "::error title=無法讀取 VM 上的腳本::ssh 或 md5sum 失敗，輸出：$REMOTE"
              exit 1
            }
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "✅ 三支腳本與 repo 一致"
            exit 0
          fi
          echo "::error title=VM 上的部署腳本與 repo 不一致::請先同步再重跑：scp deploy/{deploy.sh,rollback.sh,lib-slot.sh} <vm>:~/gts-web/"
          printf 'repo:\n%s\n\nVM:\n%s\n' "$LOCAL" "$REMOTE"
          exit 1

      - name: Deploy (blue-green switch)
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          GIT_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "$VM_USER@$VM_HOST" "~/gts-web/deploy.sh $GIT_SHA"
