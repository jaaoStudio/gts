name: Build & Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - 'docs/**'
      - 'deploy/**'          # VM 端腳本改動不需要重 build（需手動同步到 VM）

env:
  # Harbor 沿用 boss-timing 那組（HARBOR_URL/USER/PASSWORD secrets）
  IMAGE: ${{ secrets.HARBOR_URL }}/gts/gts_web_store

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 以下 action 一律用 commit SHA 釘版（後方註解標對應 tag），
      # 避免 tag 被移動導致 CI 執行到未預期的程式碼。升版時兩者要一起改。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to Harbor
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ secrets.HARBOR_URL }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          # ⚠️ 新 VM 若是 ARM 改成 linux/arm64（VM 上跑 `uname -m`：aarch64→arm64、x86_64→amd64）
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VITE_DIRECTUS_URL=/api
            VITE_DIRECTUS_PUBLIC_URL=${{ secrets.VITE_DIRECTUS_PUBLIC_URL }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE }}:cache,mode=max

      - name: Deploy (blue-green switch)
        # 自己 ssh，不依賴第三方 action（私鑰只在本步驟指令內使用）
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          GIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p ~/.ssh && echo "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "$VM_USER@$VM_HOST" "~/gts-web/deploy.sh $GIT_SHA"
