name: Build & Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.agents/**'
      - '.claude/**'
      - 'docs/**'
      - 'deploy/**'          # VM 端腳本改動不需要重 build（需手動同步到 VM）

env:
  # Harbor 沿用 boss-timing 那組（HARBOR_URL/USER/PASSWORD secrets）
  IMAGE: ${{ secrets.HARBOR_URL }}/gts/gts_web_store

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_URL }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          # ⚠️ 新 VM 若是 ARM 改成 linux/arm64（VM 上跑 `uname -m`：aarch64→arm64、x86_64→amd64）
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VITE_DIRECTUS_URL=/api
            VITE_DIRECTUS_PUBLIC_URL=${{ secrets.VITE_DIRECTUS_PUBLIC_URL }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE }}:cache,mode=max

      - name: Deploy (blue-green switch)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: ~/gts-web/deploy.sh ${{ github.sha }}
