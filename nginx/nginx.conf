worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日誌格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Gzip 壓縮
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Vue Router history mode 支援
        location / {
            try_files $uri $uri/ /index.html;
        }

        # API Proxy
        location /api/ {
            proxy_pass http://directus_app:8055/;
            # 必須與 Directus 的 PUBLIC_URL 主機名一致，否則它產生的絕對網址
            # （SSO 導向、資產連結）會指向舊網域
            proxy_set_header Host core.gtxin.com.tw;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 靜態資源快取
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            # ⚠️ 這兩行不是複製貼上的贅字：nginx 的 add_header **只在本層完全沒有
            #    宣告 add_header 時才繼承上層**。上面那行 Cache-Control 一出現，
            #    server 層的安全標頭就對這些路徑整組消失，而且不會有任何警告。
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # AdSense ads.txt 檔案
        location = /ads.txt {
            default_type text/plain;
            allow all;
        }

        # 安全標頭。加新的一條時，上面那個靜態資源 location 與下面的 /health
        # 也要各補一份——它們各自宣告了 add_header，不會繼承這裡。
        # （曾有一條 X-XSS-Protection：各家瀏覽器都已移除該功能，那行是 no-op，已刪。）
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        # 健康檢查端點
        location /health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
    }
}
